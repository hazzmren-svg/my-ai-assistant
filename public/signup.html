<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - My AI</title>

    <link
        rel="stylesheet"
        href="auth.css"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">

                <img
                    src="assets/my-ai.jpg"
                    alt="My AI"
                >

            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Create your My AI account
            </p>


            <form id="signupForm">

                <label>Name</label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required
                >


                <label>Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >


                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >


                <button
                    type="submit"
                    id="signupBtn"
                >
                    Create Account
                </button>

            </form>


            <div
                id="signupMessage"
                class="auth-message"
            ></div>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="signup.js"></script>

</body>

</html>
