<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - My AI</title>

    <link
        rel="stylesheet"
        href="auth.css"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">

                <img
                    src="assets/my-ai.jpg"
                    alt="My AI"
                >

            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to continue to My AI
            </p>


            <form id="loginForm">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="submit"
                    id="loginBtn"
                >
                    Login
                </button>

            </form>


            <div
                id="loginMessage"
                class="auth-message"
            ></div>


            <p class="auth-switch">

                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>

            </p>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
