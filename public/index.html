<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My AI Assistant</title>

<link rel="icon" href="favicon.png">

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<script>

    console.log(
        "INDEX CHECK currentUser:",
        localStorage.getItem("currentUser")
    );

    if (!localStorage.getItem("currentUser")) {

        console.log(
            "❌ NO USER → Redirecting to Login"
        );

        window.location.replace(
            "/login.html"
        );

    } else {

        console.log(
            "✅ USER FOUND → Staying on AI"
        );

    }

</script>

</head>

<body>

<div class="app">

    <!-- Sidebar -->

    <!-- Sidebar -->

<aside class="sidebar">

    <!-- Logo -->
    <div class="logo">

        <img src="assets/My Ai.jpg" alt="My AI">

        <span>My AI</span>

    </div>


    <!-- New Chat -->
    <button id="newChat">

        ＋ New Chat

    </button>

<!-- All Chats -->
<div class="all-chats-section">

    <button
        id="allChatsBtn"
        type="button">
        💬 All Chats
    </button>

</div>

 <!-- Projects -->
<div class="projects-section">

    <div class="projects-header">

        <span>📁 Projects</span>

        <button
            id="newProjectBtn"
            type="button"
            title="New Project">
            ＋
        </button>

    </div>

    <div
        id="projectsList"
        class="projects-list">
    </div>

</div>
    
    <!-- Chat History -->
    <div
        id="history"
        class="history">
    </div>


    <!-- User Profile Area -->
    <div class="user-panel">

        <button
            id="profileBtn"
            class="profile-btn"
            type="button">

            <div class="user-avatar">
                👤
            </div>

            <div class="user-info">

                <div
                    id="userName"
                    class="user-name">
                    User
                </div>

                <div
                    id="userEmail"
                    class="user-email">
                    user@email.com
                </div>

            </div>

            <span
                id="profileArrow"
                class="profile-arrow">
                ▴
            </span>

        </button>


        <!-- Profile Dropdown -->
        <div
            id="profileMenu"
            class="profile-menu">

            <button
                type="button"
                class="profile-menu-item"
                id="settingsBtn">

                ⚙️

                <span>
                    Settings
                </span>

            </button>


            <button
                type="button"
                class="profile-menu-item"
                id="appearanceBtn">

                🌙

                <span>
                    Appearance
                </span>

            </button>


            <div class="profile-menu-divider">
            </div>


            <button
                type="button"
                class="profile-menu-item logout-item"
                id="logoutBtn">

                🚪

                <span>
                    Logout
                </span>

            </button>

        </div>

    </div>


    <!-- Sidebar Footer -->
    <div class="sidebar-footer">

        My Ai Clone Pro

    </div>

</aside>
    
    <!-- Main -->

    <main class="main">

        <!-- Header -->

        <header>

            <h2>

                My AI Assistant

            </h2>

            <div class="status">

                🟢 Online

            </div>

        </header>

        <!-- Chat -->
<div id="dropZone" class="drop-zone">

    📂 Drag & Drop Files Here

</div>
        <section
        id="chat"
        class="chat">

        </section>

        <!-- Input -->

        <footer class="input-area">

    <label class="upload-btn">

        📎

        <input
    type="file"
    id="fileInput"
    hidden
    accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png,.webp">

    </label>
    <textarea
    id="message"
    placeholder="Message My AI..."
    rows="1">
</textarea>

<!-- Voice Input -->
<button
    id="voiceBtn"
    type="button"
    title="Voice Input">
    🎙️
</button>

<!-- Image Generation -->
<button
    id="imageBtn"
    type="button"
    title="Generate Image">
    🖼️
</button>

<button
    id="pauseVoiceBtn"
    type="button"
    title="Pause AI Voice">
    ⏸️
</button>
<!-- Voice Language -->
<button
    id="voiceLangBtn"
    type="button"
    title="Change voice language">
    🇧🇩
</button>

<!-- Stop AI Voice -->
<button
    id="stopVoiceBtn"
    type="button"
    title="Stop AI Voice">
    ⏹️
</button>

<!-- Send -->
<button
    id="send"
    type="button"
    title="Send Message">
    ➤
</button>

</footer>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="js/ui.js"></script>

<script src="js/storage.js"></script>

<script src="js/api.js"></script>

<script src="js/streaming.js"></script>

<script src="js/events.js"></script>

<script src="js/app.js"></script>

</body>

</html>
